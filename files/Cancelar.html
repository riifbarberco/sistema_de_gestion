<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--tinta:#000000;--tinta-2:#121110;--tinta-3:#2B2723;--laton:#C89A4A;--laton-claro:#E7C588;--hueso:#F1ECE2;--tenue:#8E8880;--alerta:#D4664A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--tinta);color:var(--hueso);font-family:'Instrument Sans',system-ui,sans-serif;padding:0 20px 60px}
.envoltura{max-width:460px;margin:0 auto}
.tope{padding:40px 0 24px;text-align:center}
.marca{display:flex;justify-content:center}
.marca svg{width:170px;height:auto;color:var(--hueso);display:block}
.regla{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:14px}
.regla span{height:1px;width:48px;background:var(--laton);opacity:.5}
.regla b{font-weight:500;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--laton)}
h2{font-size:24px;font-weight:500;letter-spacing:-.015em;margin:26px 0 16px;line-height:1.25}
.tarjeta{background:var(--tinta-2);border-left:2px solid var(--laton);border-radius:3px;padding:17px}
.fila{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:14px}
.fila span{color:var(--tenue)}
.fila b{font-weight:500;text-align:right}
.btn{width:100%;background:var(--laton);color:var(--tinta);border:none;border-radius:3px;padding:16px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin-top:22px}
.btn:hover{background:var(--laton-claro)}
.btn:focus-visible{outline:2px solid var(--hueso);outline-offset:2px}
.btn:disabled{background:var(--tinta-3);color:var(--tenue);cursor:not-allowed}
.btn.linea{background:transparent;border:1px solid var(--tinta-3);color:var(--hueso);margin-top:9px;text-align:center;text-decoration:none;display:block}
.msj{padding:24px 0;font-size:15px;line-height:1.6;color:var(--tenue);text-align:center}
.error{background:rgba(212,102,74,.1);border-left:2px solid var(--alerta);border-radius:3px;padding:14px;font-size:14px;color:#F0A28C;margin-top:16px}
.pie{font-size:12px;color:var(--tenue);text-align:center;margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="envoltura">
  <div class="tope">
    <div class="marca"><?!= include('Logo') ?></div>
    <div class="regla"><span></span><b>Tu cita</b><span></span></div>
  </div>
  <div id="zona"><div class="msj">Buscando tu cita…</div></div>
</div>
<script>
var ID = '<?= reservaId ?>';

google.script.run.withSuccessHandler(pintar).withFailureHandler(function(){
  document.getElementById('zona').innerHTML = '<div class="error">No pudimos consultar tu cita. Escríbenos por WhatsApp.</div>';
}).verReserva(ID);

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
function fila(k,v){ return '<div class="fila"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>'; }

function pintar(r){
  var z = document.getElementById('zona');
  if (!r){ z.innerHTML = '<div class="error">No encontramos esa cita. Puede que el enlace esté incompleto.</div>'; return; }
  if (String(r.estado).trim() === 'Cancelada'){
    z.innerHTML = '<h2>Esta cita ya está cancelada</h2><div class="msj">Si quieres otra fecha, reserva de nuevo cuando quieras.</div>';
    return;
  }
  z.innerHTML = '<h2>¿Cancelamos tu cita?</h2>' +
    '<div class="tarjeta">' + fila('Servicio', r.servicio) + fila('Cuándo', r.fecha + ' · ' + r.hora) +
    fila('Con', r.barbero) + '</div>' +
    '<button class="btn" id="btn">Sí, cancelar mi cita</button>' +
    '<p class="pie">Gracias por avisar. Así le damos el cupo a alguien más.</p>';
  document.getElementById('btn').onclick = cancelar;
}

function cancelar(){
  var b = document.getElementById('btn');
  b.disabled = true; b.textContent = 'Cancelando…';
  google.script.run.withSuccessHandler(function(r){
    var z = document.getElementById('zona');
    if (!r.ok){ z.innerHTML = '<div class="error">'+esc(r.error)+'</div>'; return; }
    z.innerHTML = '<h2>Cita cancelada</h2><div class="msj">Listo, ' + esc(r.reserva.nombre) +
      '. Liberamos tu cupo del ' + esc(r.reserva.fecha) + ' a las ' + esc(r.reserva.hora) + '.<br><br>' +
      'Cuando quieras volver, aquí estamos.</div>';
  }).cancelarReserva(ID);
}
</script>
</body>
</html>
