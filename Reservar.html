<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#000000;
  --tinta-2:#121110;
  --tinta-3:#2B2723;
  --laton:#C89A4A;
  --laton-claro:#E7C588;
  --hueso:#F1ECE2;
  --tenue:#8E8880;
  --alerta:#D4664A;
  --radio:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--tinta);color:var(--hueso);font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 64px}
.envoltura{max-width:520px;margin:0 auto;padding:0 20px}

/* ---- encabezado ---- */
.tope{padding:36px 0 22px;text-align:center;position:relative}
.marca{display:flex;justify-content:center}
.marca svg{width:186px;height:auto;color:var(--hueso);display:block}
.regla{display:flex;align-items:center;gap:12px;margin:14px 0 0;justify-content:center}
.regla span{height:1px;width:52px;background:linear-gradient(90deg,transparent,var(--laton))}
.regla span:last-child{background:linear-gradient(90deg,var(--laton),transparent)}
.regla b{font-weight:500;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--laton)}

/* ---- progreso ---- */
.pasos{display:flex;gap:5px;margin:26px 0 30px}
.pasos i{flex:1;height:2px;background:var(--tinta-3);border-radius:2px;transition:background .35s}
.pasos i.hecho{background:var(--laton)}

/* ---- secciones ---- */
.paso{display:none;animation:entra .32s ease both}
.paso.activo{display:block}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.paso{animation:none}*{transition:none!important}}

.rotulo{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--laton);margin-bottom:8px}
h2{font-size:25px;font-weight:500;letter-spacing:-.015em;line-height:1.2;margin-bottom:22px}
.nota{font-size:13px;color:var(--tenue);margin:-14px 0 20px;line-height:1.5}

/* ---- opciones ---- */
.lista{display:flex;flex-direction:column;gap:7px}
.opcion{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;background:var(--tinta-2);border:1px solid transparent;border-left:2px solid var(--tinta-3);color:var(--hueso);padding:15px 16px;border-radius:var(--radio);cursor:pointer;font:inherit;transition:border-color .18s,background .18s}
.opcion:hover{background:#1C1917;border-left-color:var(--laton)}
.opcion:focus-visible{outline:2px solid var(--laton-claro);outline-offset:2px}
.opcion.elegida{border-left-color:var(--laton);background:#1C1917}
.op-txt{flex:1;min-width:0}
.op-nom{font-weight:500;font-size:15px;line-height:1.3}
.op-sub{font-size:12px;color:var(--tenue);margin-top:3px}
.op-precio{font-weight:600;font-size:15px;color:var(--laton-claro);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- días ---- */
.dias{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:0 0 auto;width:60px;background:var(--tinta-2);border:1px solid var(--tinta-3);border-radius:var(--radio);padding:11px 0;text-align:center;cursor:pointer;color:var(--hueso);font:inherit;transition:.18s}
.dia:hover{border-color:var(--laton)}
.dia:focus-visible{outline:2px solid var(--laton-claro);outline-offset:2px}
.dia.elegida{background:var(--laton);border-color:var(--laton);color:var(--tinta)}
.dia .d{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.75}
.dia .n{font-size:21px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.dia .m{font-size:10px;text-transform:uppercase;opacity:.75}

/* ---- barra de silla (firma) ---- */
.silla{margin:24px 0 6px}
.silla-tit{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--tenue);margin-bottom:7px}
.barra{position:relative;height:26px;background:var(--tinta-2);border-radius:2px;overflow:hidden;border:1px solid var(--tinta-3)}
.barra .ocupado{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#2E2A26,#2E2A26 3px,#1A1815 3px,#1A1815 6px)}
.barra .tuyo{position:absolute;top:0;bottom:0;background:var(--laton);transition:left .3s,width .3s}
.silla-pie{font-size:12px;color:var(--tenue);margin-top:8px;line-height:1.45}
.silla-pie b{color:var(--laton-claro);font-weight:600}

/* ---- horas ---- */
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px;margin-top:18px}
.hora{background:var(--tinta-2);border:1px solid var(--tinta-3);border-radius:var(--radio);padding:12px 4px;text-align:center;cursor:pointer;color:var(--hueso);font:inherit;font-size:15px;font-variant-numeric:tabular-nums;transition:.16s}
.hora:hover{border-color:var(--laton)}
.hora:focus-visible{outline:2px solid var(--laton-claro);outline-offset:2px}
.hora.elegida{background:var(--laton);border-color:var(--laton);color:var(--tinta);font-weight:600}

/* ---- formulario ---- */
label{display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--tenue);margin:16px 0 6px}
input,textarea{width:100%;background:var(--tinta-2);border:1px solid var(--tinta-3);border-radius:var(--radio);padding:13px 14px;color:var(--hueso);font:inherit;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--laton)}
textarea{resize:vertical;min-height:64px}
.opcional{text-transform:none;letter-spacing:0;color:#6E7C79;font-size:11px}

/* ---- resumen ---- */
.resumen{background:var(--tinta-2);border-left:2px solid var(--laton);border-radius:var(--radio);padding:16px;margin-bottom:6px}
.fila{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:14px}
.fila span{color:var(--tenue)}
.fila b{font-weight:500;text-align:right}
.fila.total{border-top:1px solid var(--tinta-3);margin-top:8px;padding-top:11px}
.fila.total b{color:var(--laton-claro);font-size:18px;font-weight:600}

/* ---- botones ---- */
.btn{width:100%;background:var(--laton);color:var(--tinta);border:none;border-radius:var(--radio);padding:17px;font:inherit;font-weight:600;font-size:15px;letter-spacing:.04em;cursor:pointer;margin-top:24px;transition:background .18s}
.btn:hover{background:var(--laton-claro)}
.btn:focus-visible{outline:2px solid var(--hueso);outline-offset:2px}
.btn:disabled{background:var(--tinta-3);color:var(--tenue);cursor:not-allowed}
.btn.linea{background:transparent;border:1px solid var(--tinta-3);color:var(--hueso);margin-top:9px}
.btn.linea:hover{border-color:var(--laton);background:transparent}
.atras{background:none;border:none;color:var(--tenue);font:inherit;font-size:13px;cursor:pointer;padding:10px 0;margin-bottom:6px}
.atras:hover{color:var(--laton)}

/* ---- estados ---- */
.cargando{text-align:center;padding:38px 0;color:var(--tenue);font-size:14px}
.vacio{background:var(--tinta-2);border-radius:var(--radio);padding:26px 20px;text-align:center;color:var(--tenue);font-size:14px;line-height:1.6;margin-top:18px}
.error{background:rgba(212,102,74,.1);border-left:2px solid var(--alerta);border-radius:var(--radio);padding:13px 15px;font-size:14px;color:#F0A28C;margin-top:16px;line-height:1.45}

/* ---- confirmación ---- */
.sello{text-align:center;padding:14px 0 4px}
.sello .marca-ok{font-size:25px;font-weight:500;letter-spacing:-.015em;line-height:1.25;margin:18px 0 8px}
.sello .cod{display:inline-block;font-size:11px;letter-spacing:.2em;color:var(--laton);border:1px solid var(--tinta-3);padding:7px 13px;border-radius:2px;margin-top:14px}
.pie{font-size:12px;color:var(--tenue);text-align:center;margin-top:26px;line-height:1.6}
</style>
</head>
<body>
<div class="envoltura">

  <div class="tope">
    <div class="marca"><?!= include('Logo') ?></div>
    <div class="regla"><span></span><b>Reservas</b><span></span></div>
  </div>

  <div class="pasos" id="pasos">
    <i class="hecho"></i><i></i><i></i><i></i><i></i>
  </div>

  <!-- 1. SERVICIO -->
  <section class="paso activo" id="p1">
    <div class="rotulo">Paso 1 de 5</div>
    <h2>¿Que servicio necesitas?</h2>
    <div class="lista" id="servicios"><div class="cargando">Cargando servicios…</div></div>
  </section>

  <!-- 2. BARBERO -->
  <section class="paso" id="p2">
    <button class="atras" onclick="ir(1)">← Cambiar servicio</button>
    <div class="rotulo">Paso 2 de 5</div>
    <h2>¿Con quién?</h2>
    <div class="lista" id="barberos"></div>
  </section>

  <!-- 3. DÍA -->
  <section class="paso" id="p3">
    <button class="atras" onclick="ir(2)">← Cambiar barbero</button>
    <div class="rotulo">Paso 3 de 5</div>
    <h2>¿Qué día?</h2>
    <div class="dias" id="dias"></div>
  </section>

  <!-- 4. HORA -->
  <section class="paso" id="p4">
    <button class="atras" onclick="ir(3)">← Cambiar día</button>
    <div class="rotulo">Paso 4 de 5</div>
    <h2>¿A qué hora?</h2>
    <div id="zonaHoras"><div class="cargando">Buscando cupos…</div></div>
  </section>

  <!-- 5. DATOS -->
  <section class="paso" id="p5">
    <button class="atras" onclick="ir(4)">← Cambiar hora</button>
    <div class="rotulo">Paso 5 de 5</div>
    <h2>Tus datos</h2>
    <div class="resumen" id="resumen"></div>
    <label for="nombre">Nombre completo</label>
    <input id="nombre" type="text" autocomplete="name" placeholder="Como te llamamos cuando llegues">
    <label for="tel">Celular</label>
    <input id="tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="300 000 0000">
    <label for="mail">Correo <span class="opcional">— opcional, para enviarte la confirmación</span></label>
    <input id="mail" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
    <label for="notas">Algo que debamos saber <span class="opcional">— opcional</span></label>
    <textarea id="notas" placeholder="Alergias, referencia de corte, primera vez…"></textarea>
    <div id="errorForm"></div>
    <button class="btn" id="btnConfirmar" onclick="confirmar()">Confirmar mi cita</button>
  </section>

  <!-- 6. LISTO -->
  <section class="paso" id="p6">
    <div class="sello">
      <div class="regla"><span></span><b>Confirmada</b><span></span></div>
      <div class="marca-ok" id="okTitulo"></div>
      <div class="resumen" id="okResumen" style="text-align:left;margin-top:18px"></div>
      <div class="cod" id="okCodigo"></div>
    </div>
    <a id="btnWA" class="btn" style="display:block;text-align:center;text-decoration:none" href="#">Notificanos por WhatsApp</a>
    <button class="btn linea" onclick="location.reload()">Reservar otra cita</button>
    <p class="pie" id="okPie"></p>
  </section>

</div>

<script>
var D = null, sel = { servicio:null, barbero:null, fecha:null, hora:null }, pasoActual = 1, datosCupos = null;

function ir(n){
  pasoActual = n;
  for (var i=1;i<=6;i++){
    var el = document.getElementById('p'+i);
    if (el) el.classList.toggle('activo', i===n);
  }
  var barras = document.querySelectorAll('#pasos i');
  for (var j=0;j<barras.length;j++) barras[j].classList.toggle('hecho', j < Math.min(n,5));
  document.getElementById('pasos').style.display = (n===6) ? 'none' : 'flex';
  window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto':'smooth'});
}

function pesos(n){ return '$' + Number(n).toLocaleString('es-CO'); }

function duracionTxt(m){
  var h = Math.floor(m/60), r = m%60;
  if (h && r) return h+' h '+r+' min';
  if (h) return h+' h';
  return r+' min';
}

google.script.run.withSuccessHandler(arranque).withFailureHandler(function(e){
  document.getElementById('servicios').innerHTML =
    '<div class="error">No pudimos cargar los servicios. Recarga la página o escríbenos por WhatsApp.</div>';
}).getDatosIniciales();

function arranque(d){
  D = d;

  var cs = document.getElementById('servicios');
  cs.innerHTML = '';
  d.servicios.forEach(function(s){
    var b = document.createElement('button');
    b.className = 'opcion';
    b.innerHTML = '<span class="op-txt"><span class="op-nom">'+esc(s.nombre)+'</span>' +
                  '<span class="op-sub">'+duracionTxt(s.duracion)+'</span></span>' +
                  '<span class="op-precio">'+pesos(s.precio)+'</span>';
    b.onclick = function(){ sel.servicio = s; pintarBarberos(); ir(2); };
    cs.appendChild(b);
  });

  var cd = document.getElementById('dias');
  d.dias.forEach(function(dia){
    var b = document.createElement('button');
    b.className = 'dia';
    b.innerHTML = '<div class="d">'+dia.dia.slice(0,3)+'</div><div class="n">'+dia.num+'</div><div class="m">'+dia.mes+'</div>';
    b.onclick = function(){
      sel.fecha = dia.iso;
      var todos = document.querySelectorAll('.dia');
      for (var i=0;i<todos.length;i++) todos[i].classList.remove('elegida');
      b.classList.add('elegida');
      cargarCupos(); ir(4);
    };
    cd.appendChild(b);
  });
}

function pintarBarberos(){
  var c = document.getElementById('barberos');
  c.innerHTML = '';
  var lista = D.barberos.map(function(n){ return {nombre:n, valor:n, sub:''}; });
  if (D.barberos.length > 1){
    lista.unshift({nombre:'El primero disponible', valor:'*', sub:'Te asignamos al que tenga el cupo'});
  }
  lista.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opcion';
    b.innerHTML = '<span class="op-txt"><span class="op-nom">'+esc(o.nombre)+'</span>' +
                  (o.sub ? '<span class="op-sub">'+o.sub+'</span>' : '') + '</span>';
    b.onclick = function(){ sel.barbero = o.valor; ir(3); };
    c.appendChild(b);
  });
}

function cargarCupos(){
  document.getElementById('zonaHoras').innerHTML = '<div class="cargando">Buscando cupos…</div>';
  google.script.run.withSuccessHandler(pintarCupos).withFailureHandler(function(){
    document.getElementById('zonaHoras').innerHTML =
      '<div class="error">No pudimos consultar la agenda. Intenta de nuevo.</div>';
  }).getCupos(sel.barbero, sel.fecha, sel.servicio.duracion);
}

function pintarCupos(r){
  datosCupos = r;
  var z = document.getElementById('zonaHoras');

  if (r.cerrado){
    z.innerHTML = '<div class="vacio">Ese día no abrimos.<br>Escoge otra fecha.</div>';
    return;
  }
  if (!r.cupos.length){
    z.innerHTML = '<div class="vacio">No queda cupo ese día para <b>'+esc(sel.servicio.nombre)+'</b>' +
                  ' (' + duracionTxt(sel.servicio.duracion) + ').<br>Prueba otro día u otro servicio más corto.</div>';
    return;
  }

  var abre = min(r.abre), cierra = min(r.cierra), total = cierra - abre;
  var html =
    '<div class="silla">' +
      '<div class="silla-tit"><span>'+r.abre+'</span><span>La silla ese día</span><span>'+r.cierra+'</span></div>' +
      '<div class="barra" id="barra">';
  r.ocupados.forEach(function(o){
    var i = (min(o.ini)-abre)/total*100, w = (min(o.fin)-min(o.ini))/total*100;
    html += '<div class="ocupado" style="left:'+i+'%;width:'+w+'%"></div>';
  });
  html += '<div class="tuyo" id="tuyo" style="left:0;width:0"></div></div>' +
          '<div class="silla-pie" id="sillaPie">Tu <b>'+esc(sel.servicio.nombre)+'</b> ocupa ' +
          duracionTxt(sel.servicio.duracion)+'. Escoge dónde va.</div></div>';

  html += '<div class="horas">';
  r.cupos.forEach(function(c){
    html += '<button class="hora" data-h="'+c.hora+'">'+c.hora+'</button>';
  });
  html += '</div>';
  z.innerHTML = html;

  var botones = z.querySelectorAll('.hora');
  for (var i=0;i<botones.length;i++){
    botones[i].onclick = (function(btn){ return function(){
      var h = btn.getAttribute('data-h');
      sel.hora = h;
      for (var k=0;k<botones.length;k++) botones[k].classList.remove('elegida');
      btn.classList.add('elegida');
      var ini = min(h), fin = ini + sel.servicio.duracion;
      var t = document.getElementById('tuyo');
      t.style.left = ((ini-abre)/total*100)+'%';
      t.style.width = ((fin-ini)/total*100)+'%';
      document.getElementById('sillaPie').innerHTML =
        'De <b>'+h+'</b> a <b>'+txt(fin)+'</b> · '+duracionTxt(sel.servicio.duracion);
      setTimeout(function(){ pintarResumen(); ir(5); }, 260);
    };})(botones[i]);
  }
}

function min(hhmm){ var p = hhmm.split(':'); return +p[0]*60 + +p[1]; }
function txt(m){ return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2); }

function pintarResumen(){
  var dia = D.dias.filter(function(d){ return d.iso===sel.fecha; })[0];
  var quien = (sel.barbero==='*') ? 'El primero disponible' : sel.barbero;
  document.getElementById('resumen').innerHTML =
    fila('Servicio', sel.servicio.nombre) +
    fila('Cuándo', dia.dia+' '+dia.num+' '+dia.mes+', '+sel.hora) +
    fila('Con', quien) +
    fila('Dura', duracionTxt(sel.servicio.duracion)) +
    '<div class="fila total"><span>Valor</span><b>'+pesos(sel.servicio.precio)+'</b></div>';
}

function fila(k,v){ return '<div class="fila"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>'; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

function confirmar(){
  var nombre = document.getElementById('nombre').value.trim();
  var tel = document.getElementById('tel').value.trim();
  var caja = document.getElementById('errorForm');
  caja.innerHTML = '';

  if (nombre.length < 3){ caja.innerHTML = '<div class="error">Escribe tu nombre completo.</div>'; return; }
  if (tel.replace(/\D/g,'').length < 7){ caja.innerHTML = '<div class="error">Escribe un celular válido para poder confirmarte.</div>'; return; }

  var btn = document.getElementById('btnConfirmar');
  btn.disabled = true; btn.textContent = 'Guardando tu cita…';

  google.script.run.withSuccessHandler(function(r){
    if (!r.ok){
      btn.disabled = false; btn.textContent = 'Confirmar mi cita';
      caja.innerHTML = '<div class="error">'+esc(r.error)+'</div>';
      return;
    }
    mostrarOk(r);
  }).withFailureHandler(function(){
    btn.disabled = false; btn.textContent = 'Confirmar mi cita';
    caja.innerHTML = '<div class="error">No se pudo guardar. Revisa tu conexión e intenta otra vez.</div>';
  }).crearReserva({
    servicio: sel.servicio.nombre, barbero: sel.barbero, fecha: sel.fecha, hora: sel.hora,
    nombre: nombre, telefono: tel,
    email: document.getElementById('mail').value.trim(),
    notas: document.getElementById('notas').value.trim()
  });
}

function mostrarOk(r){
  var v = r.reserva;
  var dia = D.dias.filter(function(d){ return d.iso===v.fecha; })[0];
  document.getElementById('okTitulo').textContent = 'Nos vemos el ' + dia.dia.toLowerCase() + ' ' + dia.num;
  document.getElementById('okResumen').innerHTML =
    fila('Servicio', v.servicio) +
    fila('Cuándo', dia.dia+' '+dia.num+' '+dia.mes+', '+v.hora) +
    fila('Con', v.barbero) +
    '<div class="fila total"><span>Valor</span><b>'+pesos(v.precio)+'</b></div>';
  document.getElementById('okCodigo').textContent = 'Código ' + v.id;
  document.getElementById('okPie').innerHTML =
    'Si no puedes venir, avísanos con tiempo y le damos el cupo a alguien más.<br>' +
    (D.direccion ? esc(D.direccion) : '');
  var msg = encodeURIComponent('Hola, acabo de reservar. Código ' + v.id + ' — ' + v.servicio + ', ' + dia.dia + ' ' + dia.num + ' a las ' + v.hora + '.');
  document.getElementById('btnWA').href = 'https://wa.me/' + r.whatsapp + '?text=' + msg;
  ir(6);
}
</script>
</body>
</html>
